init_rand_seed: 42
dataset_name: lavdf_mbavloc
devices: ['cuda:0',]
output_folder: ./ckpt/mbavloc/
train_split: 'train'
val_split: 'dev'
model_name: "MBAVLocTransformer"

# paths
cache_dir: /scratch/zm21856/cached_features/
anno_file: /scratch/zm21856/LAV-DF/LAV-DF/metadata.min.json

loader: {
    batch_size: 16,
    num_workers: 4,
}

dataset: {
    feat_fps: 25,
    max_seq_len: 1024,
    trunc_thresh: 0.5,
    crop_ratio: [0.9, 1.0],
}

# MB-AV-Loc model config
model: {
    # fusion
    visual_dim: 512,
    audio_dim: 768,
    fusion_dim: 256,
    num_latents: 8,
    num_fusion_layers: 2,
    p_drop_visual: 0.1,
    p_drop_audio: 0.1,
    num_audio_layers: 4,

    # backbone (convTransformer -> FPN)
    backbone_type: 'convTransformer',
    fpn_type: fpn,
    backbone_arch: [2, 1, 5],
    scale_factor: 2,
    max_seq_len: 1024,
    max_buffer_len_factor: 16.0,
    n_mha_win_size: -1,
    use_abs_pe: False,
    use_rel_pe: False,
    n_head: 4,
    embd_kernel_size: 3,
    embd_dim: 512,
    embd_with_ln: True,
    fpn_dim: 512,
    fpn_with_ln: True,
    fpn_start_level: 0,
    head_dim: 512,
    head_kernel_size: 3,
    head_num_layers: 3,
    head_with_ln: True,
    num_classes: 1,
    use_lstm: True,
    with_Difference: False,

    regression_range: [[0, 4], [4, 8], [8, 16], [16, 32], [32, 64], [64, 10000]],
}

train_cfg: {
    init_loss_norm: 100,
    cls_prior_prob: 0.01,
    center_sample: radius,
    center_sample_radius: 1.5,
    clip_grad_l2norm: 1.0,
    loss_weight: 1.0,
    head_empty_cls: [],
    dropout: 0.0,
    droppath: 0.1,
    label_smoothing: 0.0,
}

test_cfg: {
    voting_thresh: 0.7,
    pre_nms_topk: 2000,
    max_seg_num: 10,
    min_score: 0.9,
    iou_threshold: 0.01,
    multiclass_nms: True,
    nms_method: 'hard',
    pre_nms_thresh: 0.001,
    nms_sigma: 0.5,
    duration_thresh: 0.05,
    ext_score_file: None,
}

opt: {
    learning_rate: 0.0005,
    epochs: 50,
    weight_decay: 0.001,
    type: "AdamW",
    momentum: 0.9,
    warmup: True,
    warmup_epochs: 5,
    schedule_type: "cosine",
    schedule_steps: [],
    schedule_gamma: 0.1,
}
